
name: release

# Builds, signs and publishes production release artifacts.
# Requires a successful build.yml run for the exact commit being released.
#
# Required Android signing secrets:
# PHONEBOX_KEYSTORE_BASE64
# PHONEBOX_STORE_PASSWORD
# PHONEBOX_KEY_ALIAS
# PHONEBOX_KEY_PASSWORD
#
# Optional Windows signing configuration:
# SIGNPATH_SIGNING_POLICY (repository variable)
# SIGNPATH_API_TOKEN (repository secret)

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create the release as a draft
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ============================================================
  # Verify CI status and release version
  # ============================================================

  version:
    name: Verify CI and release version
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    outputs:
      version: ${{ steps.v.outputs.version }}

    steps:
      - name: Verify release branch
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases must be triggered from main"
            exit 1
          fi

      - name: Verify successful CI build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          echo "Checking CI status for commit $SHA"

          result=$(gh api --method GET \
            "repos/$REPO/actions/workflows/build.yml/runs" \
            -f head_sha="$SHA" \
            -f branch=main \
            -f event=push \
            --jq '[.workflow_runs[] |
              select(.head_sha == env.SHA and
                     .status == "completed" and
                     .conclusion == "success")] |
              first // empty')

          if [ -z "$result" ]; then
            echo "::error::No successful CI build found for commit $SHA"
            echo "::error::Wait for build.yml to complete successfully before releasing"
            exit 1
          fi

          echo "CI validation passed."
          echo "$result" | jq -r '"CI run: " + .html_url'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: v
        name: Read and check the version
        shell: bash
        run: |
          v=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' \
            agent/PhoneBox.Agent/PhoneBox.Agent.csproj | head -n1)

          if [ -z "$v" ]; then
            echo "::error::Unable to determine the agent version"
            exit 1
          fi

          grep -Fq "versionName = \"$v\"" android/app/build.gradle.kts || {
            echo "::error::Android versionName does not match $v"
            exit 1
          }

          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "::error::v$v is already released; bump the version first"
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::Unable to verify existing release tags"
              exit 1
            fi
          fi

          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Release version: $v"

  # ============================================================
  # Build and sign the Android release APK
  # ============================================================

  apk:
    name: Android release APK
    needs: version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.PHONEBOX_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PHONEBOX_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PHONEBOX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PHONEBOX_KEY_PASSWORD }}
        shell: bash
        run: |
          for secret in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::Missing Android signing configuration: $secret"
              exit 1
            fi
          done

          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build the release APK
        working-directory: android
        env:
          PHONEBOX_STORE_FILE: ${{ runner.temp }}/release.keystore
          PHONEBOX_STORE_PASSWORD: ${{ secrets.PHONEBOX_STORE_PASSWORD }}
          PHONEBOX_KEY_ALIAS: ${{ secrets.PHONEBOX_KEY_ALIAS }}
          PHONEBOX_KEY_PASSWORD: ${{ secrets.PHONEBOX_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk \
            "../dist/PhoneBox-${{ needs.version.outputs.version }}.apk"

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk
          path: dist/
          if-no-files-found: error

  # ============================================================
  # Build native agents for all supported platforms
  # ============================================================

  agent:
    name: Release agent (${{ matrix.rid }})
    needs: version

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, tfm: net10.0-windows10.0.19041.0 }
          - { os: ubuntu-latest, rid: linux-x64, tfm: net10.0 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, tfm: net10.0 }
          - { os: macos-latest, rid: osx-arm64, tfm: net10.0 }
          - { os: macos-15-intel, rid: osx-x64, tfm: net10.0 }

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('agent/**/*.csproj', '**/Directory.Build.props', '**/Directory.Build.targets', '**/Directory.Packages.props', '**/NuGet.Config', '**/nuget.config', '**/packages.lock.json', '**/global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      # Windows x64, Linux x64 and macOS ARM64 have already
      # passed unit tests in the successful CI workflow.
      # Test the additional release architectures only.

      - name: Unit tests for additional architectures
        if: matrix.rid == 'linux-arm64' || matrix.rid == 'osx-x64'
        run: dotnet test agent/PhoneBox.Agent.Tests --nologo

      # Self-contained single file: no .NET runtime required.
      # Keep compression disabled to reduce runtime memory usage.

      - name: Publish (self-contained, single file)
        run: >
          dotnet publish agent/PhoneBox.Agent
          -c Release
          -f ${{ matrix.tfm }}
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -o out
          --nologo

      - name: Sign macOS apphost ad hoc
        if: startsWith(matrix.rid, 'osx-')
        run: codesign --force --sign - out/PhoneBoxAgent

      # Authenticode signing through SignPath Foundation.
      # Signing must occur before smoke tests, packaging,
      # checksums and artifact attestations.

      - name: Sign PhoneBoxAgent.exe (SignPath)
        if: matrix.rid == 'win-x64' && vars.SIGNPATH_SIGNING_POLICY != ''
        uses: ./.github/actions/sign-windows-agent
        with:
          exe: out/PhoneBoxAgent.exe
          signing-policy: ${{ vars.SIGNPATH_SIGNING_POLICY }}
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          trusted: ${{ vars.SIGNPATH_SIGNING_POLICY == 'release-signing' }}

      # Always test the actual production binaries,
      # even when unit tests have already passed in CI.

      - name: Smoke-test the published agent on its native architecture
        shell: pwsh
        run: |
          $exe = if ($IsWindows) {
            'out/PhoneBoxAgent.exe'
          } else {
            'out/PhoneBoxAgent'
          }

          python tools/smoke-agent.py $exe --version '${{ needs.version.outputs.version }}'

          if ($LASTEXITCODE) {
            exit $LASTEXITCODE
          }

      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null

          Compress-Archive `
            -Path out/* `
            -DestinationPath "dist/PhoneBoxAgent-${{ needs.version.outputs.version }}-${{ matrix.rid }}.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-agent-${{ matrix.rid }}
          path: dist/
          if-no-files-found: error

  # ============================================================
  # Attest, package and publish the GitHub release
  # ============================================================

  publish:
    name: Publish GitHub release
    needs: [version, apk, agent]
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Verify release artifacts
        working-directory: dist
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 6

          test -s "PhoneBox-$VERSION.apk"

          for rid in win-x64 linux-x64 linux-arm64 osx-arm64 osx-x64; do
            test -s "PhoneBoxAgent-$VERSION-$rid.zip"
          done

          echo "All six release artifacts verified."
          ls -lh

      - name: Attest release artifacts
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.apk
            dist/*.zip

      - name: Save the provenance bundle
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" \
            "dist/PhoneBox-${{ needs.version.outputs.version }}.intoto.jsonl"

      - name: Checksums
        working-directory: dist
        run: |
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 7
          test "$(find . -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 5
          test "$(find . -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1

          sha256sum * > "SHA256SUMS-${{ needs.version.outputs.version }}.txt"

          cat "SHA256SUMS-${{ needs.version.outputs.version }}.txt"

          sha256sum --check "SHA256SUMS-${{ needs.version.outputs.version }}.txt"

      - name: Release notes from CHANGELOG.md
        run: |
          v="${{ needs.version.outputs.version }}"

          section() {
            awk -v v="$1" '/^## /{
              if (on) exit;
              on = ($2 == v);
              next
            } on' CHANGELOG.md
          }

          section "$v" > notes.md
          [ -s notes.md ] || section Unreleased > notes.md
          [ -s notes.md ] || echo "PhoneBox $v" > notes.md

          cat >> notes.md <<'EOF'

          ---
          [Code signing policy](https://github.com/paulgeorge92/phonebox#code-signing-policy) · [Privacy policy](https://github.com/paulgeorge92/phonebox/blob/main/PRIVACY.md)
          EOF

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.version.outputs.version }}"

          gh release create "v$v" dist/* \
            --title "PhoneBox $v" \
            --notes-file notes.md \
            --target "${{ github.sha }}" \
            ${{ inputs.draft && '--draft' || '' }}

      # Draft releases are not publicly accessible.
      # Update package manifests only for published releases.

      - name: Update the Scoop bucket and the winget manifests
        if: ${{ !inputs.draft }}
        run: |
          v="${{ needs.version.outputs.version }}"
          sha=$(sha256sum "dist/PhoneBoxAgent-$v-win-x64.zip" | cut -d' ' -f1)

          python3 - "$v" "$sha" <<'PY'
          import json, sys

          v, sha = sys.argv[1], sys.argv[2]
          p = 'bucket/phonebox.json'

          m = json.load(open(p, encoding='utf-8'))
          m['version'] = v
          m['architecture']['64bit']['url'] = f'https://github.com/paulgeorge92/phonebox/releases/download/v{v}/PhoneBoxAgent-{v}-win-x64.zip'
          m['architecture']['64bit']['hash'] = sha

          m.get('suggest', {}).pop('.NET Desktop Runtime 10', None)

          open(p, 'w', encoding='utf-8').write(
              json.dumps(m, indent=4, ensure_ascii=False) + '\n'
          )
          PY

          python3 packaging/winget/make-manifests.py "$v" "$sha"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bucket/phonebox.json packaging/winget/manifests

          git commit -m "Scoop and winget manifests for $v"
          git push origin HEAD:main
